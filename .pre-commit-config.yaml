# DoML reproducibility hooks (REPR-03).
# marimo notebooks are plain .py files with no stored outputs, so nothing needs stripping.
# This hook lints every notebook with marimo's own checker before commit.
repos:
  - repo: local
    hooks:
      - id: marimo-check
        name: marimo check
        entry: marimo check --strict
        language: system
        files: ^notebooks/.*\.py$
